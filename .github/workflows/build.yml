name: Build SpiderMonkey

# Deliberately manual. A full matrix is roughly an hour per configuration even on
# fast hardware, and the output only changes when the ESR line moves - a few
# times a year. Consumers download the published assets; they do not build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Firefox ESR version (e.g. 153.3.0esr)
        type: string
        required: true
        default: 153.3.0esr
      runner:
        # A library is only linkable by a toolchain at least as new as the one
        # that built it: MSVC's STL headers call helpers that live in its own
        # libcpmt.lib, so a consumer on an older Visual Studio gets undefined
        # __std_* symbols. Building on the older image keeps the artifacts
        # usable by both.
        description: Runner image - windows-2022 (VS 2022) builds artifacts that link on more machines
        type: choice
        options: [windows-2022, windows-latest]
        default: windows-2022
      publish:
        description: Publish the artifacts as a release
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    # GitHub's hard ceiling is 360. Hosted runners are 4 vCPU, so a cold
    # SpiderMonkey build is much slower here than on a workstation; this leaves
    # room without letting a hung build burn the full allowance.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, config: Release }
          - { arch: x64, config: Debug }
          - { arch: x86, config: Release }
          - { arch: x86, config: Debug }

    steps:
      - uses: actions/checkout@v4

      # Unpacking the source runs at a flat ~120 files/second on this image -
      # roughly 8 ms per file, constant across seventeen minutes of heartbeat
      # samples. A constant per-file cost that high is scanning overhead, not
      # disk throughput; the Server 2025 image, which does not run real-time
      # protection, does the same work three to six times faster.
      #
      # Safe here: the runner is single-tenant, built from a GitHub image, and
      # destroyed when the job ends. It reports whether it was accepted, so the
      # next timing can be read against a known state rather than an assumed one.
      - name: Exclude the build root from Defender
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\sm | Out-Null
          try {
            Add-MpPreference -ExclusionPath C:\sm -ErrorAction Stop
            "excluded C:\sm from real-time scanning"
          } catch {
            "could not set a Defender exclusion: $($_.Exception.Message)"
          }

      # PowerShell only discovers that a function does not exist when the line
      # calling it runs, and in this script that can be an hour in. Cheaper to
      # ask the parser first.
      - name: Check the build script
        shell: pwsh
        run: .\check-script.ps1 .\build-spidermonkey.ps1

      # A typo here would otherwise surface as a confusing 404 partway through
      # the download step, after the toolchain work has already run.
      - name: Check the version exists
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          if ($v -notmatch '^\d+\.\d+(\.\d+)?esr$') {
            throw "'$v' does not look like an ESR version (expected e.g. 153.3.0esr)."
          }
          $url = "https://ftp.mozilla.org/pub/firefox/releases/$v/source/firefox-$v.source.tar.xz"
          try   { $r = Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing -TimeoutSec 60 }
          catch { throw "No source tarball for '$v' at $url" }
          "$v is available ($([math]::Round($r.Headers.'Content-Length'[0]/1MB)) MB)"

      # SpiderMonkey cannot be built with MSVC proper - clang-cl is mandatory.
      # The runner image ships Visual Studio, but whether the Clang component is
      # included has varied, so fail loudly here rather than 40 minutes in.
      - name: Check for clang-cl
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -property installationPath
          $clang = Join-Path $vs 'VC\Tools\Llvm\x64\bin\clang-cl.exe'
          if (-not (Test-Path $clang)) {
            throw "x64-hosted clang-cl not found under $vs. The runner image lacks the C++ Clang tools component."
          }
          & $clang --version | Select-Object -First 1

      # The source path must be 62 characters or fewer (see README), so the
      # build root has to be short - not under the workspace.
      - name: Build and package
        shell: pwsh
        run: |
          .\build-spidermonkey.ps1 `
            -Root C:\sm `
            -Arch ${{ matrix.arch }} `
            -Config ${{ matrix.config }} `
            -Version ${{ inputs.version }} `
            -Verify

      # Package before deleting anything: the objdir is only needed until the
      # single .lib exists.
      # The version goes in the filename: without it, artifacts from runs of
      # different ESR lines are indistinguishable once downloaded. So does the
      # MSVC toolset, which is what decides whether a consumer can link the
      # archive at all. The build wrote it to toolset.txt, so the two cannot
      # drift.
      - name: Zip the distribution
        id: zip
        shell: pwsh
        run: |
          $tag  = "${{ matrix.arch }}-$("${{ matrix.config }}".ToLower())"
          $dist = "C:\sm\dist-$tag"
          if (-not (Test-Path "$dist\spidermonkey.lib")) { throw "no library at $dist" }
          if (-not (Test-Path "$dist\toolset.txt"))      { throw "no toolset.txt at $dist" }
          $msvc = (Get-Content "$dist\toolset.txt" -Raw).Trim()
          $name = "spidermonkey-${{ inputs.version }}-$tag-msvc$msvc"
          # Not Compress-Archive: it buffers the archive in memory and fails past
          # 2 GB with "Stream was too long", which a Debug build comfortably
          # exceeds. The .NET call streams straight to the file and writes Zip64
          # headers when the content needs them.
          $zip = "$env:GITHUB_WORKSPACE\$name.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $dist, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          "name=$name" >> $env:GITHUB_OUTPUT
          "{0} {1:N0} MB (needs MSVC {2} or newer)" -f "$name.zip", ((Get-Item $zip).Length/1MB), $msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: spidermonkey-*.zip
          retention-days: 7
          compression-level: 0   # already a zip
          # Re-running for a version already built replaces its artifact rather
          # than failing on the name.
          overwrite: true

      # A failed build is worth diagnosing without re-running an hour of work.
      # Always, not only on failure. A cancelled job is not a failed one, so
      # three stalled runs in a row were killed without keeping a single line of
      # what they had been doing. This takes every log the build writes,
      # including tar's full extraction listing - too much to echo to the
      # console, exactly the right amount to keep.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch }}-${{ matrix.config }}
          path: C:\sm\*.log
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: spidermonkey-*
          merge-multiple: true
      # Each zip is well under the 2 GiB per-asset limit; a combined archive
      # would not be, so they are published separately.
      # Re-running for a version that already has a release replaces its assets
      # and its notes, rather than failing on the existing tag.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la *.zip
          tag="spidermonkey-${{ inputs.version }}"

          cat > notes.md <<'EOF'
          Static SpiderMonkey libraries built against the static CRT.

          | Configuration | CRT | Consumer defines |
          |---|---|---|
          | x64/x86 Release | `/MT` (`libcmt`) | `STATIC_JS_API` `XP_WIN` |
          | x64/x86 Debug | `/MTd` (`libcmtd`) | `STATIC_JS_API` `XP_WIN` `DEBUG` |

          Link `mincore.lib` alongside the usual Win32 set. Each archive contains
          `spidermonkey.lib`, `include/`, a `README.txt` and a `toolset.txt`.

          The `msvc<x.y>` in each filename is the MSVC toolset the library was built
          with, and it is a **floor, not a match**: link it with that toolset or any
          newer one. An older toolset fails with undefined `__std_*` symbols, because
          MSVC's STL headers call helpers that ship in its own `libcpmt.lib` and each
          release only adds to that set.

          Every configuration was verified by linking a DLL and executing JavaScript
          through it, and by confirming zero dynamic-CRT imports.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "SpiderMonkey ${{ inputs.version }}" --notes-file notes.md
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber *.zip
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "SpiderMonkey ${{ inputs.version }}" --notes-file notes.md *.zip
          fi
